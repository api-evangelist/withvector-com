components:
  schemas:
    PostResponse:
      type: object
      properties:
        message:
          type: string
        ingestionConfigId:
          type: string
    Post10EntitiesActionsIngestionBolIngestRequest:
      type: object
      properties:
        metadata:
          type: string
          description: Shipment metadata envelope containing shipmentMetadata array.
        file:
          type: string
          description: One or more PDF document files.
      required:
      - metadata
      - file
    Post10EntitiesActionsIngestionBolIngestResponse:
      type: object
      properties:
        message:
          type: string
          description: Acknowledgement message.
        ingestionConfigId:
          type: string
          description: The ingestion config ID used.
    Post10EntitiesQueryRequest:
      type: object
      properties:
        filters:
          type: array
          description: Array of filter objects that narrow down which documents are returned.
        orders:
          type: array
          description: Array controlling the sort order of the response.
        metadata:
          type: object
          description: Controls pagination and result grouping (size, offset, maxSizePerGroup, shouldIncludeLeafEntities).
    Post10EntitiesQueryResponse:
      type: object
      properties:
        children:
          type: array
          description: Array where each item contains a data object – a fully hydrated entity in the same shape as the Get Single Document response.
        count:
          type: integer
          description: Total number of matched documents.
    Post10EntitiesRecordsRequest:
      type: object
      properties:
        entity graph:
          type: string
          description: Fully built entity graph with platform mixin UUIDs, file IDs, and resolved relationships.
      required:
      - entity graph
    Get10EntitiesRecordsUniqueidResponse:
      type: object
      properties:
        uniqueId:
          type: string
          description: UUID of the document in Vector.
        mixins:
          type: object
          description: Active and inactive schema mixins (Entity, Document, Bill of Lading, etc.).
        owner:
          type: object
          description: Owner information including user and firm details.
        status.state:
          type: string
          description: 'Processing state: "idle" (ready) or "busy" (operations cannot be performed).'
        createdBy:
          type: object
          description: User who created the document (entityId and displayName).
        creationDate:
          type: string
          description: ISO 8601 timestamp when the document was created.
        modifiedBy:
          type: object
          description: User who last modified the document.
        modifiedDate:
          type: string
          description: ISO 8601 timestamp when the document was last modified.
        document.name:
          type: string
          description: Document name/identifier.
        document.address:
          type: object
          description: Resolved address with region, locality, postalCode, streetAddress, geolocation.
        document.processed:
          type: boolean
          description: Whether the document has been processed.
        document.uploadDate:
          type: string
          description: ISO 8601 timestamp when the document was uploaded.
        document.attachments:
          type: object
          description: Files array and aggregate PDF with download URIs.
        core_documents_shipment.*:
          type: object
          description: All fields specific to the core_documents_shipment entity (e.g., identification, carrier, weight, etc.) as shown in the
            example response.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
